[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwdemo"
version = "1.0.0"
description = "An educational demonstration of weak unsalted password hashes vs. modern salted hashing, using only synthetic passwords and bounded searches."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
bcrypt = ["bcrypt>=4.0"]

[project.scripts]
pwdemo = "pwdemo.cli:main"

[tool.setuptools]
packages = ["pwdemo"]
